# Production stack used by install.sh. It runs the published image — nothing is built on the
# server. install.sh copies this file to /opt/firezap-api/docker-compose.yml next to the .env it
# generates, so "docker compose" works from that folder with no extra flags.
#
# Two ways to receive HTTPS traffic, chosen by COMPOSE_PROFILES in .env:
#   caddy  — Caddy takes ports 80/443 and gets Let's Encrypt certificates by itself.
#   (empty) — another web server on the machine (nginx, Apache, aaPanel, cPanel…) proxies to the
#             API on 127.0.0.1:${FZ_LOCAL_PORT}.
# The API always listens on loopback only; PostgreSQL is never published.
name: firezap-api

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: firezap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: firezap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firezap -d firezap"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/firezaprepo/firezap-api:${FZ_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://firezap:${POSTGRES_PASSWORD}@postgres:5432/firezap?sslmode=disable
      HTTP_PORT: "8080"
    ports:
      - "127.0.0.1:${FZ_LOCAL_PORT:-8080}:8080"

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
