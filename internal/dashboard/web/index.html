<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>FireZAP API</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="i18n.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand"><img src="favicon.svg" alt="" width="26" height="26"><span>FireZAP API</span><small id="version"></small></div>
  <div class="top-actions">
    <select id="lang" aria-label="Language">
      <option value="en">English</option>
      <option value="pt-BR">Português (Brasil)</option>
    </select>
    <button id="logout" class="ghost" hidden data-i18n="logout"></button>
  </div>
</header>

<main>
  <!-- Login -->
  <section id="login" class="card narrow" hidden>
    <h1 data-i18n="loginTitle"></h1>
    <p class="muted" data-i18n="loginHelp"></p>
    <form id="login-form">
      <label for="admin-key" data-i18n="adminKey"></label>
      <input id="admin-key" type="password" autocomplete="current-password" required spellcheck="false">
      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="primary" data-i18n="enter"></button>
    </form>
    <p class="muted small" data-i18n="keyStorage"></p>
  </section>

  <!-- Instances -->
  <section id="app" hidden>
    <div class="row between">
      <h1 data-i18n="instances"></h1>
      <button id="new-instance" class="primary" data-i18n="newInstance"></button>
    </div>
    <p id="empty" class="card muted" hidden data-i18n="noInstances"></p>
    <div id="list" class="grid"></div>
    <p class="muted small"><span data-i18n="autoRefresh"></span> · <a href="https://github.com/firezaprepo/firezap-api" rel="noopener noreferrer" target="_blank" data-i18n="docs"></a></p>
  </section>
</main>

<!-- One dialog, filled by app.js for each action -->
<dialog id="dialog">
  <form method="dialog" class="dialog-head">
    <h2 id="dialog-title"></h2>
    <button class="ghost icon" value="close" aria-label="Close">✕</button>
  </form>
  <div id="dialog-body"></div>
</dialog>

<div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
